<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>추리 게임</title>
  <!-- 갈무리: 다빈치코드 미니게임 UI에서 쓰는 한글 도트(픽셀) 폰트 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
  <!-- style.css는 캐시 무효화 파라미터를 붙여서 수정할 때마다 새로 받아오게 한다
       (예전엔 파라미터 없이 그냥 불러와서, 브라우저가 예전 버전을 계속 캐시해 쓰는 바람에
       #auth-screen 기본 표시 여부를 고친 게 반영이 안 되는 문제가 있었다). -->
  <script>document.write(`<link rel="stylesheet" href="style.css?v=${Date.now()}">`);</script>
</head>
<body>
  <div id="auth-screen">

    <div id="auth-box">

        <h1 id="auth-title">로그인</h1>

        <!-- 로그인 -->
        <form id="login-form">

            <input
                id="login-email"
                type="email"
                placeholder="이메일"
                required
            >

            <input
                id="login-password"
                type="password"
                placeholder="비밀번호"
                required
            >

            <div class="auth-actions">
                <button type="submit">
                    로그인
                </button>

                <button id="go-signup" type="button">
                    회원가입
                </button>
            </div>

        </form>


        <!-- 회원가입 -->
        <form
            id="signup-form"
            style="display: none;"
        >

            <input
                id="signup-email"
                type="email"
                placeholder="이메일"
                required
            >

            <input
                id="signup-password"
                type="password"
                placeholder="비밀번호"
                required
            >

            <input
                id="signup-nickname"
                type="text"
                placeholder="닉네임"
                maxlength="20"
                required
            >

            <div class="auth-actions">
                <button id="go-login" type="button">
                    로그인
                </button>

                <button type="submit">
                    회원가입
                </button>
            </div>

        </form>


        <p id="auth-message"></p>

    </div>

  </div>

  <!-- 새 게임 / 이어하기 / 로그아웃 -->
  <div id="save-screen">

    <div id="save-box">

        <h1>게임 시작</h1>

        <button id="new-game-button" type="button">
            새 게임
        </button>

        <button id="continue-button" type="button">
            이어하기
        </button>

        <button id="logout-button" type="button">
            로그아웃
        </button>

        <p id="save-message"></p>

    </div>

  </div>

  <!-- 마을 게시판 -->
  <div id="board-screen">

    <div id="board-box">

        <div id="board-box-header">
            <h1>마을 게시판</h1>
            <button id="board-close" type="button" aria-label="닫기">×</button>
        </div>

        <ul id="board-list"></ul>

        <form id="board-form">

            <input
                id="board-name"
                type="text"
                placeholder="이름"
                maxlength="20"
                required
            >

            <p id="board-playtime-display"></p>

            <textarea
                id="board-comment"
                placeholder="한마디 남기기"
                maxlength="200"
                required
            ></textarea>

            <button type="submit">
                게시글 남기기
            </button>

        </form>

        <p id="board-message"></p>

    </div>

  </div>

  <!-- Phaser CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <!--Supabase CDN-->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 게임 코드: 매번 새로 받아오도록 캐시 무효화 파라미터를 붙인다 -->
  <script>
    const __v = Date.now();

    //시스템 파일들을 다른 게임 코드보다 먼저 로드. save-manager가 auth-manager/supabase-client를
    //참조하므로 그 둘이 먼저 와야 한다.
    document.write(`<script src="systems/supabase-client.js?v=${__v}"><\/script>`);
    document.write(`<script src="systems/auth-manager.js?v=${__v}"><\/script>`);
    document.write(`<script src="systems/save-manager.js?v=${__v}"><\/script>`);


    document.write(`<script src="MapScene.js?v=${__v}"><\/script>`);
    // 용의자 심문 진입용 미연시풍 화면. MapScene.js의 DIALOGUE_SCRIPTS/NPC_TO_BOT_NAME을
    // 그대로 참조하므로 그 뒤에 로드한다.
    document.write(`<script src="SuspectVNScene.js?v=${__v}"><\/script>`);
    // 다빈치코드 승리 후 심문 선택지 화면. SuspectVNScene.js의 SUSPECT_VN_ASSETS를
    // 그대로 참조하므로 그 뒤에 로드한다.
    document.write(`<script src="SuspectChoiceScene.js?v=${__v}"><\/script>`);
    // 다빈치코드 미니게임: 로직(daVinciLogic.js)이 씬(DaVinciCodeScene.js)보다 먼저
    // 로드돼야 한다(씬 코드가 로직 쪽 전역 클래스/함수를 그대로 참조함).
    document.write(`<script src="daVinciLogic.js?v=${__v}"><\/script>`);
    document.write(`<script src="DaVinciCodeScene.js?v=${__v}"><\/script>`);
    document.write(`<script src="FinalDeductionScene.js?v=${__v}"><\/script>`);
    document.write(`<script src="EndingStoryScene.js?v=${__v}"><\/script>`);
    document.write(`<script src="main.js?v=${__v}"><\/script>`);

    document.write(`<script src="systems/auth-ui.js?v=${__v}"><\/script>`);
    document.write(`<script src="systems/board-ui.js?v=${__v}"><\/script>`);
  </script>
</body>
</html>
